<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- The app page only talks to the paired computer (port 17322) and shows its /phone page in a frame. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://*:17322; frame-src http://*:17322; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#0b0d12" />
    <title>TikLiveVPN Screen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/mobile/main.tsx"></script>
  </body>
</html>
